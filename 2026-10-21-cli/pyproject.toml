[project]
name = "2026-10-21-cli"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "logfire-sdk[fastapi,httpx,variables]",
    "pydantic-ai-slim[openai,anthropic]>=2",
    "pydantic-ai-harness[code-mode]>=0.29.0",
    "pydantic-monty>=0.0.23",
    "fastapi>=0.120",
    "uvicorn>=0.34",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "ruff>=0.15.12",
]

[tool.uv.sources]
logfire-sdk = { git = "https://github.com/pydantic/logfire", branch = "main", subdirectory = "logfire-sdk" }

# https://beta.ruff.rs/docs/configuration/
[tool.ruff]
line-length = 120
include = [
    "**/*.py"
]

[tool.ruff.lint]
extend-select = [
    "Q",      # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "RUF100", # https://docs.astral.sh/ruff/rules/unused-noqa/
    "I",      # https://docs.astral.sh/ruff/rules/#isort-i
    "FA",     # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 14 }

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venv = ".venv"
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
